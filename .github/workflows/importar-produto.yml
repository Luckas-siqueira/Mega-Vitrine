name: Importar produto Shopee
run-name: Importar produto ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      product_url:
        description: Link HTTPS do produto na Shopee
        required: true
        type: string
      request_id:
        description: Identificador gerado pelo painel
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: importar-produto-main
  cancel-in-progress: false
jobs:
  importar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar processador de imagens
        run: python -m pip install Pillow==11.3.0
      - name: Extrair produto e otimizar imagens
        env:
          IMPORT_URL: ${{ inputs.product_url }}
          IMPORT_REQUEST_ID: ${{ inputs.request_id }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
        run: python scripts/importar_shopee.py
      - name: Salvar rascunho para o painel
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .imports imagens/produtos imagens/ampliadas imagens/originais
          git diff --cached --quiet && exit 0
          git commit -m 'Prepara importação de produto Shopee'
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            git push origin HEAD:main && exit 0
          done
          exit 1
